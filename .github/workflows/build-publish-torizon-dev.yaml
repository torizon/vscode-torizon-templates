name: Publish Torizon Utils
on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fixup actions pipx paths
        run: |
          echo "PIPX_HOME=$HOME/.local/pipx" >> $GITHUB_ENV
          echo "PIPX_BIN_DIR=$HOME/.local/bin" >> $GITHUB_ENV

      - name: Setup Xonsh
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip pipx
          PSSWD=noempty bash ./scripts/bash/setup-xonsh.sh


      - name: Build
        run: |
          echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
          cd ./scripts
          xonsh ./build-internal-containers.xsh dev
