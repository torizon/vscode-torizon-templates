name: Publish Torizon Utils
on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Fixup actions pipx paths
        run: |
          echo "PIPX_HOME=$HOME/.local/pipx" >> $GITHUB_ENV
          echo "PIPX_BIN_DIR=$HOME/.local/bin" >> $GITHUB_ENV

      - name: Setup Xonsh
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip pipx
          PSSWD=noempty bash ./scripts/bash/setup-xonsh.sh

      - name: Set up QEMU
        # registers binfmt/QEMU handlers so the multi-arch (arm64) image builds
        # can run under emulation on the amd64 runner
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # host network so the buildx container can push to the local staging
          # registry (localhost:5000) used for the pre-publish trufflehog scan
          driver-opts: network=host

      - name: Build
        run: |
          echo "${{ secrets.DOCKER_PASS }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
          cd ./scripts
          xonsh ./build-internal-containers.xsh dev
