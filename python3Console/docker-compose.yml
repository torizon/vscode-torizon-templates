services:
  __container__-debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
      platforms:
        - linux/${IMAGE_ARCH}
    image: ${LOCAL_REGISTRY}:5002/__container__-debug:${TAG}
    ports:
      - ${DEBUG_SSH_PORT}:${DEBUG_SSH_PORT}
      - ${DEBUG_PORT1}:${DEBUG_PORT1}
    profiles:
      - debug

  __container__:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/${IMAGE_ARCH}
    image: ${DOCKER_LOGIN}/__container__:${TAG}
    profiles:
      - release
