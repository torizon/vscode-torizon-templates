services:
  __container__-debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
      platforms:
        - linux/${IMAGE_ARCH}
    image: ${LOCAL_REGISTRY}:5002/__container__-debug:${TAG}
    ports:
      - ${DEBUG_SSH_PORT}:${DEBUG_SSH_PORT}
      - 7001:7001
    profiles:
      - debug

  __container__:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/${IMAGE_ARCH}
    image: ${DOCKER_LOGIN}/__container__:${TAG}
    ports:
      - 7001:7001
    profiles:
      - release

  __container__-browser-debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
      platforms:
        - linux/${IMAGE_ARCH}
    image: ${LOCAL_REGISTRY}:5002/__container__-debug:${TAG}
    ports:
      - ${DEBUG_SSH_PORT}:${DEBUG_SSH_PORT}
      - 7001:7001
    depends_on:
      - cog
    profiles:
      - debug

  __container__-browser:
    build:
      context: .
      dockerfile: Dockerfile.debug
      platforms:
        - linux/${IMAGE_ARCH}
    image: ${DOCKER_LOGIN}/__container__:${TAG}
    ports:
      - 7001:7001
    depends_on:
      - cog
    profiles:
      - release

  cog:
    image: torizon/cog${GPU}:4
    command: http://localhost:7001 -w
    environment:
      - ACCEPT_FSL_EULA=1
    # Required to get udev events from host udevd via netlink
    network_mode: host
    volumes:
      - type: bind
        source: /tmp
        target: /tmp
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /run/udev
        target: /run/udev
    cap_add:
      - CAP_SYS_TTY_CONFIG
    # Add device access rights through cgroup...
    device_cgroup_rules:
      # ... for tty
      - "c 4:* rmw"
      # ... for /dev/input devices
      - "c 13:* rmw"
      - "c 199:* rmw"
      # ... for /dev/dri devices
      - "c 226:* rmw"
    depends_on:
      - weston
    profiles:
      - release

  weston:
    image: torizon/weston${GPU}:4
    environment:
      - ACCEPT_FSL_EULA=1
    # Required to get udev events from host udevd via netlink
    network_mode: host
    volumes:
      - type: bind
        source: /tmp
        target: /tmp
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /run/udev
        target: /run/udev
    cap_add:
      - CAP_SYS_TTY_CONFIG
    # Add device access rights through cgroup...
    device_cgroup_rules:
      # ... for tty
      - "c 4:* rmw"
      # ... for /dev/input devices
      - "c 13:* rmw"
      # ... for /dev/galcore
      - "c 199:* rmw"
      # ... for /dev/dri devices
      - "c 226:* rmw"
      # ... for /dev/dma_heap device
      - "c 253:* rmw"
    profiles:
      - release
      - debug
