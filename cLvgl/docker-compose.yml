services:
  __container__-debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
      platforms:
        - linux/${IMAGE_ARCH}
    image: ${LOCAL_REGISTRY}:5002/__container__-debug:${TAG}
    ports:
      - ${DEBUG_SSH_PORT}:${DEBUG_SSH_PORT}
    device_cgroup_rules:
      # Add device access rights through cgroup
      # ... for tty
      - "c 4:* rmw"
      # ... for /dev/input devices
      - "c 13:* rmw"
      # ... for /dev/dri devices
      - "c 226:* rmw"
      # ... for /dev/uinput
      - "c 10:223 rmw"
      # ... for /dev/fb0
      - "c 29:* rmw"
    volumes:
      - type: bind
        source: /dev
        target: /dev
    profiles:
      - debug

  __container__:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/${IMAGE_ARCH}
    image: ${DOCKER_LOGIN}/__container__:${TAG}
    device_cgroup_rules:
      # Add device access rights through cgroup
      # ... for tty
      - "c 4:* rmw"
      # ... for /dev/input devices
      - "c 13:* rmw"
      # ... for /dev/dri devices
      - "c 226:* rmw"
      # ... for /dev/uinput
      - "c 10:223 rmw"
      # ... for /dev/fb0
      - "c 29:* rmw"
    volumes:
      - type: bind
        source: /dev
        target: /dev
    profiles:
      - release
